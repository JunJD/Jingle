name: Desktop Release
run-name: Release ${{ github.event_name == 'push' && github.ref_name || inputs.candidate_tag }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Unpublished candidate tag (vX.Y.Z or vX.Y.Z-nightly.YYYYMMDD[.N])
        required: true
        type: string
      expected_main_sha:
        description: Full 40-character SHA currently published at main
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.candidate_tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Verify candidate source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      main_sha: ${{ steps.candidate.outputs.main_sha }}
      mode: ${{ steps.candidate.outputs.mode }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
      version: ${{ steps.candidate.outputs.version }}

    steps:
      - name: Verify public main and prerequisite runs
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.candidate_tag }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_main_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || 'candidate' }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          candidate_tag="$CANDIDATE_TAG"
          expected_main_sha="$EXPECTED_MAIN_SHA"
          mode="$RELEASE_MODE"

          if [[ "$candidate_tag" == "v0.0.2-nightly.20260718.1" ]]; then
            echo "::error::$candidate_tag is a retired local trial tag and must never be published. Choose a new version."
            exit 1
          fi

          if [[ "$candidate_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            prerelease="false"
          elif [[ "$candidate_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(\.[0-9]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
            prerelease="true"
          else
            echo "::error::Unsupported candidate tag '$candidate_tag'. Use vX.Y.Z or vX.Y.Z-nightly.YYYYMMDD[.N]."
            exit 1
          fi

          if [[ ! "$expected_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_main_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi

          repo_json="$(gh api "repos/$GH_REPO")"
          default_branch="$(jq -r '.default_branch' <<< "$repo_json")"
          if [[ "$default_branch" != "main" ]]; then
            echo "::error::The public default branch must be main, got '$default_branch'."
            exit 1
          fi
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$default_branch" --jq '.object.sha')"
          if [[ "$mode" == "candidate" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$default_branch" ]]; then
              echo "::error::Run candidate verification from the public default branch '$default_branch', not '$GITHUB_REF'."
              exit 1
            fi
            for candidate in "$expected_main_sha" "$EVENT_SHA" "$WORKFLOW_SHA"; do
              if [[ "$candidate" != "$main_sha" ]]; then
                echo "::error::Candidate source mismatch. Public main is $main_sha; received $candidate."
                exit 1
              fi
            done
          elif [[ "$mode" == "publish" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$candidate_tag" ]]; then
              echo "::error::Publish runs must start from tag $candidate_tag, not '$GITHUB_REF'."
              exit 1
            fi
            tag_commit_sha="$(gh api "repos/$GH_REPO/commits/$candidate_tag" --jq '.sha')"
            for candidate in "$expected_main_sha" "$EVENT_SHA" "$WORKFLOW_SHA" "$tag_commit_sha"; do
              if [[ "$candidate" != "$main_sha" ]]; then
                echo "::error::Release source mismatch. Public main is $main_sha; received $candidate."
                exit 1
              fi
            done
          else
            echo "::error::Unsupported release mode '$mode'."
            exit 1
          fi

          existing_tag_count="$(
            gh api "repos/$GH_REPO/git/matching-refs/tags/$candidate_tag" |
              jq --arg ref "refs/tags/$candidate_tag" '[.[] | select(.ref == $ref)] | length'
          )"
          if [[ "$mode" == "candidate" && "$existing_tag_count" != "0" ]]; then
            echo "::error::Tag $candidate_tag already exists. Choose a new candidate version."
            exit 1
          fi
          if [[ "$mode" == "publish" && "$existing_tag_count" != "1" ]]; then
            echo "::error::Release tag $candidate_tag is not the unique published tag ref."
            exit 1
          fi

          repo_owner="${GH_REPO%%/*}"
          repo_name="${GH_REPO#*/}"
          release_json="$(
            gh api graphql \
              -f query='query($owner: String!, $name: String!, $tag: String!) {
                repository(owner: $owner, name: $name) {
                  release(tagName: $tag) { description id isDraft tagName }
                }
              }' \
              -f owner="$repo_owner" \
              -f name="$repo_name" \
              -f tag="$candidate_tag" \
              --jq '.data.repository.release // {}'
          )"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          if [[ "$mode" == "candidate" && -n "$release_id" ]]; then
            echo "::error::Release $candidate_tag already exists. Choose a new candidate version."
            exit 1
          fi
          if [[ "$mode" == "publish" && -n "$release_id" ]]; then
            release_marker="jingle-release-source:$main_sha"
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]] ||
              [[ "$(jq -r '.description // ""' <<< "$release_json")" != *"$release_marker"* ]]; then
              echo "::error::Release $candidate_tag already exists without this run's draft ownership marker."
              exit 1
            fi
          fi

          require_successful_workflow() {
            local workflow_file="$1"
            local workflow_name="$2"
            local runs
            runs="$(
              gh api -X GET "repos/$GH_REPO/actions/workflows/$workflow_file/runs" \
                -f branch="$default_branch" \
                -f event=push \
                -f status=completed \
                -f per_page=100
            )"
            if ! jq -e --arg sha "$main_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion == "success"' \
              <<< "$runs" >/dev/null; then
              echo "::error::$workflow_name has no successful push run for public main $main_sha."
              exit 1
            fi
          }

          require_successful_workflow "ci.yml" "CI"
          require_successful_workflow "codeql.yml" "CodeQL"

          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          {
            if [[ "$mode" == "publish" ]]; then
              echo "### Tag release"
            else
              echo "### Build-only release candidate"
            fi
            echo "- Default branch: \`$default_branch\`"
            echo "- Commit: \`$main_sha\`"
            echo "- Tag: \`$candidate_tag\`"
            echo "- Mode: \`$mode\`"
            echo "- CI and CodeQL: successful"
            if [[ "$mode" == "candidate" ]]; then
              echo "- This run does not create a tag or release and does not retain packaged assets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: preflight
    permissions:
      contents: read
    env:
      JINGLE_BUILD_PROVENANCE: release-workflow
      JINGLE_BUILD_SOURCE_REVISION: ${{ needs.preflight.outputs.main_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            runner: macos-latest
            expected_arch: arm64
            expected_artifact_arch: arm64
            command: pnpm run dist:mac
          - name: windows
            runner: windows-latest
            expected_arch: x64
            expected_artifact_arch: x64
            command: pnpm run dist:win
          - name: linux
            runner: ubuntu-24.04
            expected_arch: x64
            expected_artifact_arch: x86_64
            command: pnpm run dist:linux

    steps:
      - name: Checkout verified public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.main_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"

      - name: Restore Electron distribution cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          case "$RUNNER_ARCH" in
            X64) normalized_runner_arch="x64" ;;
            ARM64) normalized_runner_arch="arm64" ;;
            *)
              echo "::error::Unsupported runner architecture '$RUNNER_ARCH'."
              exit 1
              ;;
          esac
          node_arch="$(node -p 'process.arch')"
          if [[ "$normalized_runner_arch" != "$EXPECTED_ARCH" || "$node_arch" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Expected $EXPECTED_ARCH, runner reported $RUNNER_ARCH and Node reported $node_arch."
            exit 1
          fi

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          package_manager="$(node -p 'require("./package.json").packageManager')"
          expected_version="${package_manager#pnpm@}"
          expected_version="${expected_version%%+*}"
          corepack prepare "$package_manager" --activate
          actual_version="$(pnpm --version)"
          test "$actual_version" = "$expected_version" || {
            echo "::error::Expected pnpm $expected_version, got $actual_version"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from candidate
        shell: bash
        run: |
          npm version "${{ needs.preflight.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Audit frontend package declarations
        run: pnpm run audit:frontend-packages

      - name: Package desktop app
        env:
          JINGLE_BUILD_TARGET_ARCH: ${{ matrix.expected_arch }}
        run: ${{ matrix.command }}

      - name: Verify local package output
        shell: bash
        env:
          EXPECTED_ARTIFACT_ARCH: ${{ matrix.expected_artifact_arch }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          shopt -s nullglob
          case "$RUNNER_OS_NAME" in
            macOS)
              packages=(dist/*.dmg)
              expected_packages=(dist/*-mac-"$EXPECTED_ARTIFACT_ARCH".dmg)
              required_metadata=(dist/*.dmg.blockmap dist/latest-mac.yml)
              expected_metadata_count=2
              update_metadata=dist/latest-mac.yml
              ;;
            Windows)
              packages=(dist/*.exe)
              expected_packages=(dist/*-win-"$EXPECTED_ARTIFACT_ARCH".exe)
              required_metadata=(dist/*.exe.blockmap dist/latest.yml)
              expected_metadata_count=2
              update_metadata=dist/latest.yml
              ;;
            Linux)
              packages=(dist/*.AppImage)
              expected_packages=(dist/*-linux-"$EXPECTED_ARTIFACT_ARCH".AppImage)
              required_metadata=(dist/latest-linux.yml)
              expected_metadata_count=1
              update_metadata=dist/latest-linux.yml
              ;;
            *)
              echo "::error::Unsupported runner OS '$RUNNER_OS_NAME'."
              exit 1
              ;;
          esac

          if (( ${#packages[@]} != 1 || ${#expected_packages[@]} != 1 )); then
            echo "::error::Expected exactly one $RUNNER_OS_NAME package for architecture $EXPECTED_ARTIFACT_ARCH; found ${#packages[@]} total and ${#expected_packages[@]} matching."
            exit 1
          fi
          if [[ "${packages[0]}" != "${expected_packages[0]}" ]]; then
            echo "::error::Packaged application does not carry the expected architecture in its name."
            exit 1
          fi
          if (( ${#required_metadata[@]} != expected_metadata_count )); then
            echo "::error::Expected $expected_metadata_count update metadata files; found ${#required_metadata[@]}."
            exit 1
          fi
          for metadata in "${required_metadata[@]}"; do
            if [[ ! -s "$metadata" ]]; then
              echo "::error::Required update metadata '$metadata' is missing or empty."
              exit 1
            fi
          done
          PACKAGE_PATH="${packages[0]}" \
            METADATA_PATH="$update_metadata" \
            RELEASE_VERSION="${{ needs.preflight.outputs.version }}" \
            node --input-type=module <<'NODE'
          import { createHash } from "node:crypto"
          import { readFileSync, statSync } from "node:fs"
          import { basename } from "node:path"

          const packagePath = process.env.PACKAGE_PATH
          const metadataPath = process.env.METADATA_PATH
          const releaseVersion = process.env.RELEASE_VERSION
          if (!packagePath || !metadataPath || !releaseVersion) {
            throw new Error("Release metadata verification environment is incomplete.")
          }
          const packageName = basename(packagePath)
          const metadata = readFileSync(metadataPath, "utf8")
          const readSingle = (pattern, field) => {
            const matches = [...metadata.matchAll(pattern)]
            if (matches.length !== 1 || !matches[0][1]) {
              throw new Error(`${basename(metadataPath)} has invalid ${field}.`)
            }
            return matches[0][1]
          }
          const metadataVersion = readSingle(/^version: (.+)$/gm, "version")
          const metadataUrl = readSingle(/^  - url: (.+)$/gm, "file url")
          const metadataFileSha512 = readSingle(/^    sha512: (.+)$/gm, "file sha512")
          const metadataFileSize = Number(readSingle(/^    size: (\d+)$/gm, "file size"))
          const metadataPathValue = readSingle(/^path: (.+)$/gm, "path")
          const metadataSha512 = readSingle(/^sha512: (.+)$/gm, "sha512")
          const actualSha512 = createHash("sha512")
            .update(readFileSync(packagePath))
            .digest("base64")
          if (
            metadataVersion !== releaseVersion ||
            metadataUrl !== packageName ||
            metadataPathValue !== packageName ||
            metadataSha512 !== actualSha512 ||
            metadataFileSha512 !== actualSha512 ||
            metadataFileSize !== statSync(packagePath).size
          ) {
            throw new Error(`${basename(metadataPath)} does not match ${packageName}.`)
          }
          NODE

          {
            echo "### $RUNNER_OS_NAME package verification"
            package="${packages[0]}"
            if [[ ! -s "$package" ]]; then
              echo "::error::Packaged application '$package' is empty."
              exit 1
            fi
            echo "- \`$(basename "$package")\`"
            echo "- Architecture: \`${{ matrix.expected_arch }}\`"
            if [[ "${{ needs.preflight.outputs.mode }}" == "publish" ]]; then
              echo "- Release asset staged after installed smoke passes."
            else
              echo "- Build-only: no artifact was uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux installed-smoke prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            desktop-file-utils \
            libfuse2t64 \
            xdg-utils
          if [[ ! -c /dev/fuse ]]; then
            echo "::error::GitHub runner does not expose /dev/fuse; raw AppImage smoke cannot run."
            exit 1
          fi
          for command in desktop-file-install desktop-file-validate update-desktop-database xdg-mime; do
            command -v "$command" >/dev/null || {
              echo "::error::Missing Linux installed-smoke prerequisite: $command"
              exit 1
            }
          done

      - name: Run installed first-launch smoke
        id: installed_smoke
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINGLE_BUILD_TARGET_ARCH: ${{ matrix.expected_arch }}
          JINGLE_RELEASE_RUNNER_ARCH: ${{ runner.arch }}
          JINGLE_RELEASE_RUNNER_OS: ${{ runner.os }}
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run --auto-servernum -- pnpm run release:smoke:installed -- \
              --current-dir dist \
              --diagnostics-dir release-smoke-diagnostics \
              --upgrade-baseline v0.0.1
          else
            pnpm run release:smoke:installed -- \
              --current-dir dist \
              --diagnostics-dir release-smoke-diagnostics \
              --upgrade-baseline v0.0.1
          fi

      - name: Upload installed smoke diagnostics
        if: failure() && steps.installed_smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-smoke-diagnostics-${{ matrix.name }}
          path: release-smoke-diagnostics
          if-no-files-found: error
          retention-days: 3

      - name: Stage verified release assets
        if: needs.preflight.outputs.mode == 'publish'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    if: needs.preflight.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - package
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Verify and publish release assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.preflight.outputs.main_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          expected_assets=(
            "Jingle-$RELEASE_VERSION-linux-x86_64.AppImage"
            "Jingle-$RELEASE_VERSION-mac-arm64.dmg"
            "Jingle-$RELEASE_VERSION-mac-arm64.dmg.blockmap"
            "Jingle-$RELEASE_VERSION-win-x64.exe"
            "Jingle-$RELEASE_VERSION-win-x64.exe.blockmap"
            "latest-linux.yml"
            "latest-mac.yml"
            "latest.yml"
          )
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} != ${#expected_assets[@]} )); then
            echo "::error::Expected ${#expected_assets[@]} release assets, found ${#assets[@]}."
            printf 'Found: %s\n' "${assets[@]}"
            exit 1
          fi
          for expected_asset in "${expected_assets[@]}"; do
            asset="release-assets/$expected_asset"
            if [[ ! -s "$asset" ]]; then
              echo "::error::Required release asset '$expected_asset' is missing or empty."
              exit 1
            fi
          done

          verify_update_metadata() {
            local metadata="$1"
            local package="$2"
            local package_name
            package_name="$(basename "$package")"
            local metadata_version metadata_url metadata_sha512 metadata_size
            local metadata_path metadata_path_sha512 actual_size actual_sha512
            metadata_version="$(sed -n 's/^version: //p' "$metadata")"
            metadata_url="$(sed -n 's/^  - url: //p' "$metadata")"
            metadata_sha512="$(sed -n 's/^    sha512: //p' "$metadata")"
            metadata_size="$(sed -n 's/^    size: //p' "$metadata")"
            metadata_path="$(sed -n 's/^path: //p' "$metadata")"
            metadata_path_sha512="$(sed -n 's/^sha512: //p' "$metadata")"
            actual_size="$(wc -c < "$package" | tr -d '[:space:]')"
            actual_sha512="$(openssl dgst -sha512 -binary "$package" | base64 -w 0)"

            if [[ "$metadata_version" != "$RELEASE_VERSION" ]] ||
              [[ "$metadata_url" != "$package_name" ]] ||
              [[ "$metadata_path" != "$package_name" ]] ||
              [[ "$metadata_size" != "$actual_size" ]] ||
              [[ -z "$metadata_sha512" ]] ||
              [[ "$metadata_sha512" != "$metadata_path_sha512" ]] ||
              [[ "$metadata_sha512" != "$actual_sha512" ]]; then
              echo "::error::Update metadata $(basename "$metadata") does not match $package_name."
              exit 1
            fi
          }

          verify_update_metadata \
            release-assets/latest-linux.yml \
            "release-assets/Jingle-$RELEASE_VERSION-linux-x86_64.AppImage"
          verify_update_metadata \
            release-assets/latest-mac.yml \
            "release-assets/Jingle-$RELEASE_VERSION-mac-arm64.dmg"
          verify_update_metadata \
            release-assets/latest.yml \
            "release-assets/Jingle-$RELEASE_VERSION-win-x64.exe"

          current_main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          tag_commit_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$current_main_sha" != "$RELEASE_SHA" || "$tag_commit_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release source changed while packaging; expected $RELEASE_SHA, main is $current_main_sha and tag is $tag_commit_sha."
            exit 1
          fi

          release_marker="<!-- jingle-release-source:$RELEASE_SHA -->"
          release_notes="$release_marker

          > This build is unsigned and not notarized. macOS Gatekeeper and Windows SmartScreen may show warnings.

          > The Linux AppImage desktop entry launches with \`--no-sandbox\` for Ubuntu 24.04 compatibility."
          if release_json="$(gh release view "$RELEASE_TAG" --json body,isDraft,tagName 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]] ||
              [[ "$(jq -r '.body // ""' <<< "$release_json")" != *"$release_marker"* ]]; then
              echo "::error::Release $RELEASE_TAG already exists without this workflow's draft ownership marker."
              exit 1
            fi
          else
            args=(
              --verify-tag
              --draft
              --generate-notes
              --notes "$release_notes"
              --title "Jingle $RELEASE_TAG"
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
